; PHP settings for the production container.
; Errors are logged (they appear in the Render logs), never shown to visitors.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

expose_php = Off
short_open_tag = Off
date.timezone = UTC

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 25M

session.cookie_httponly = 1
session.use_strict_mode = 1

; System certificate store, so outbound HTTPS to TMDB and Groq is verified.
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt

; Code only changes when a new image is deployed, so skip per-request file checks.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
