# Apache worker limits for the container.
#
# Render's free instance has 512 MB of memory, and each Apache worker keeps
# its own persistent database connection. Capping the workers keeps both the
# memory use and the number of database connections well inside their limits.
# Recycling each worker after 500 requests also refreshes its connection.

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       10
    MaxConnectionsPerChild 500
</IfModule>
