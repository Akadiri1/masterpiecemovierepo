# Apache site for the container. Mirrors the local setup: www/ is the public
# web root, and any path that isn't a real file goes to www/index.php.

ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/www

    <Directory /var/www/html/www>
        Options -Indexes +FollowSymLinks

        # The routing rules live here rather than in .htaccess, because this
        # repo git-ignores every .htaccess file, so none reach the server.
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [QSA,L]
    </Directory>

    # Render ends HTTPS at its proxy and forwards plain HTTP to the container.
    # Mark the request as HTTPS again so PHP and secure cookies see the real scheme.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # The base image links these files to the container's stdout/stderr,
    # so they show up in the Render logs.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
